# XGBoost baseline plus the attention fusion model (needs the "research" extra: torch).
run_name: fusion-baseline
seed: 42

data:
  source: legacy_colab
  n_educators: 2000

split:
  val_size: 0.15
  test_size: 0.15

features:
  text:
    encoder: tfidf_svd
    dim: 16
  sequence:
    seq_len_weeks: 5
  watch_history:
    max_neighbors: 15

models:
  xgb:
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 30
  fusion:
    enabled: true
    lr: 0.001
    weight_decay: 0.00001
    batch_size: 32
    max_epochs: 30
    patience: 5
    common_dim: 32
    seq_hidden: 32
    n_heads: 4
    dropout: 0.2

calibration:
  method: isotonic

fairness:
  group: years_experience
  numeric: true
  n_buckets: 3
  max_disparity: 0.10

recommender:
  enabled: true
  alpha: 0.5
  passes: 3

personas:
  n_clusters: 4

gates:
  macro_auc: 0.70
  min_label_auc: 0.65
  max_ece: 0.05
  max_disparity: 0.10

tracking:
  mlflow: false

output:
  dir: artifacts
