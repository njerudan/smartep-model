name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install (core + dev; torch-free)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Tests (fusion test is skipped without torch)
        run: uv run pytest -q
